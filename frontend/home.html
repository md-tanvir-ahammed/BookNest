<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BookNest - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <nav class="navbar">
        <h2 class="logo">BookNest</h2>
        <div class="nav-right">
            <a href="profile.html" class="profile-link" id="user-greeting">👤 Profile</a>
            <button class="add-btn" onclick="openAddBook()">+ Add Book</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="home-content">
        <h1 id="welcome-heading">Welcome!</h1>
        <p>Upload your own PDF books, read them, and rate them.</p>
    </div>

    <!-- Search & Category Filters -->
    <div class="controls-section">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Search by title or author..." oninput="handleSearch()" />
        </div>
        <div class="category-filters" id="category-filters">
            <button class="filter-btn active" data-category="All" onclick="setCategoryFilter('All')">All</button>
            <button class="filter-btn" data-category="Favorites" onclick="setCategoryFilter('Favorites')">❤️ Favorites</button>
            <button class="filter-btn" data-category="Fiction" onclick="setCategoryFilter('Fiction')">Fiction</button>
            <button class="filter-btn" data-category="Non-Fiction" onclick="setCategoryFilter('Non-Fiction')">Non-Fiction</button>
            <button class="filter-btn" data-category="Science" onclick="setCategoryFilter('Science')">Science</button>
            <button class="filter-btn" data-category="History" onclick="setCategoryFilter('History')">History</button>
            <button class="filter-btn" data-category="Biography" onclick="setCategoryFilter('Biography')">Biography</button>
            <button class="filter-btn" data-category="Fantasy" onclick="setCategoryFilter('Fantasy')">Fantasy</button>
            <button class="filter-btn" data-category="Technology" onclick="setCategoryFilter('Technology')">Technology</button>
            <button class="filter-btn" data-category="Other" onclick="setCategoryFilter('Other')">Other</button>
        </div>
    </div>

    <!-- Book Grid -->
    <div class="book-grid" id="book-grid"></div>

    <!-- Add Book Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-box small">
            <button class="close-btn" onclick="closeAddBook()">✕</button>
            <h2>Add a New Book</h2>
            <div class="form-group">
                <label>Book Title</label>
                <input type="text" id="new-title" placeholder="Enter book title" />
            </div>
            <div class="form-group">
                <label>Author Name</label>
                <input type="text" id="new-author" placeholder="Enter author name" />
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="new-category">
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Science">Science</option>
                    <option value="History">History</option>
                    <option value="Biography">Biography</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Technology">Technology</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Upload PDF</label>
                <input type="file" id="new-pdf" accept="application/pdf" />
            </div>
            <button class="btn" onclick="addBook()">Add Book</button>
            <p id="add-msg" class="add-msg"></p>
        </div>
    </div>

    <!-- Reading Modal -->
    <div class="modal-overlay" id="read-modal">
        <div class="modal-box theme-dark">
            <button class="close-btn" onclick="closeBook()">✕</button>
            <h2 id="modal-title">Book Title</h2>
            <p class="modal-author" id="modal-author">by Author</p>

            <!-- Eye-Friendly Controls & Download Toolbar -->
            <div class="reader-toolbar">
                <div class="control-group">
                    <span class="control-label">Zoom:</span>
                    <button class="zoom-btn active" id="zoom-100" onclick="setZoom(1.0)">100%</button>
                    <button class="zoom-btn" id="zoom-75" onclick="setZoom(0.75)">75%</button>
                    <button class="zoom-btn" id="zoom-125" onclick="setZoom(1.25)">125%</button>
                    <button class="zoom-btn" id="zoom-150" onclick="setZoom(1.5)">150%</button>
                </div>
                <div class="control-group">
                    <span class="control-label">Theme:</span>
                    <button class="theme-btn active" id="theme-dark-btn" onclick="setTheme('dark')">🌙 Dark</button>
                    <button class="theme-btn" id="theme-light-btn" onclick="setTheme('light')">☀️ Light</button>
                    <button class="theme-btn" id="theme-sepia-btn" onclick="setTheme('sepia')">📜 Sepia</button>
                </div>
                <button class="download-btn" onclick="downloadPdf()">📥 Download PDF</button>
            </div>

            <div class="pdf-controls">
                <button onclick="prevPage()">‹ Prev</button>
                <span id="page-info">Page 1 / 1</span>
                <button onclick="nextPage()">Next ›</button>
            </div>

            <!-- Reading Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
                <span id="progress-text" class="progress-text">0% completed</span>
            </div>

            <div class="pdf-viewer">
                <canvas id="pdf-canvas"></canvas>
            </div>

            <div class="rating-section">
                <p>Rate this book:</p>
                <div class="stars" id="rating-stars">
                    <span data-value="1">☆</span>
                    <span data-value="2">☆</span>
                    <span data-value="3">☆</span>
                    <span data-value="4">☆</span>
                    <span data-value="5">☆</span>
                </div>
                <p id="rating-msg"></p>
            </div>

            <!-- Comment System Section -->
            <div class="comments-section">
                <h3>Community Discussion</h3>
                <div class="comment-form">
                    <textarea id="comment-input" placeholder="Share your thoughts about this book..." rows="3"></textarea>
                    <button class="btn comment-btn" onclick="addComment()">Post Comment</button>
                    <p id="comment-msg" class="comment-msg"></p>
                </div>
                <div id="comments-list" class="comments-list"></div>
            </div>
        </div>
    </div>

    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="config.js"></script>
    <script src="home.js"></script>
</body>
</html>
